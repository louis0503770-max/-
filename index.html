<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>중2 마스터 퀴즈 앱 v2.0</title>
    <style>
        :root { --primary: #6366f1; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; }
        body { font-family: 'Pretendard', sans-serif; background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: var(--card); padding: 2rem; border-radius: 20px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3); width: 90%; max-width: 500px; }
        .header { text-align: center; margin-bottom: 2rem; }
        .subject-btns { display: grid; gap: 1rem; margin-top: 1rem; }
        .btn { padding: 15px; border: none; border-radius: 12px; background: var(--primary); color: white; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 1rem; }
        .btn:hover { opacity: 0.9; transform: translateY(-2px); }
        .option-btn { background: #334155; margin-bottom: 10px; text-align: left; width: 100%; }
        .option-btn:hover { background: #475569; }
        .correct { background: #22c55e !important; }
        .wrong { background: #ef4444 !important; }
        .hidden { display: none; }
        #progress { height: 6px; background: #334155; border-radius: 3px; margin-bottom: 20px; overflow: hidden; }
        #bar { height: 100%; background: var(--primary); width: 0%; transition: 0.3s; }
    </style>
</head>
<body>

<div class="container" id="main-container">
    <div id="start-screen">
        <div class="header">
            <h1>🚀 중2 학습 마스터</h1>
            <p>오늘 정복할 과목을 선택하세요!</p>
        </div>
        <div class="subject-btns">
            <button class="btn" onclick="startQuiz('korean')">국어 (음운 체계)</button>
            <button class="btn" onclick="startQuiz('math')">수학 (식의 계산 & 기하)</button>
        </div>
    </div>

    <div id="quiz-screen" class="hidden">
        <div id="progress"><div id="bar"></div></div>
        <h2 id="question">질문이 여기에 나옵니다.</h2>
        <div id="options"></div>
        <button id="next-btn" class="btn hidden" onclick="loadNextQuestion()" style="width:100%; margin-top:1rem;">다음 문제</button>
    </div>

    <div id="result-screen" class="hidden">
        <div class="header">
            <h1>결과 확인</h1>
            <p id="result-text"></p>
            <button class="btn" onclick="location.reload()" style="width:100%;">처음으로 돌아가기</button>
        </div>
    </div>
</div>

<script>
    const quizBank = {
        korean: [
            { q: "입술소리이면서 비음(울림소리)인 것은?", a: ["ㅁ", "ㅂ", "ㄴ", "ㅇ"], cor: 0 },
            { q: "단모음 분류 기준이 아닌 것은?", a: ["혀의 높낮이", "혀의 앞뒤 위치", "입술 모양", "소리의 세기"], cor: 3 },
            { q: "혀의 높이가 가장 낮은 '저모음'은?", a: ["ㅣ", "ㅔ", "ㅐ", "ㅡ"], cor: 2 }
        ],
        math: [
            { q: "2³ × 2⁴를 계산하면?", a: ["2¹²", "2⁷", "4⁷", "4¹²"], cor: 1 },
            { q: "삼각형의 외심에서 각 꼭짓점에 이르는 거리는?", a: ["모두 같다", "서로 다르다", "밑변의 절반이다", "알 수 없다"], cor: 0 },
            { q: "모든 순환소수는 유리수이다?", a: ["O", "X"], cor: 0 }
        ]
    };

    let currentSubject = [];
    let currentIdx = 0;
    let score = 0;

    function startQuiz(subject) {
        currentSubject = quizBank[subject];
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        loadQuestion();
    }

    function loadQuestion() {
        const q = currentSubject[currentIdx];
        document.getElementById('question').innerText = q.q;
        document.getElementById('bar').style.width = `${(currentIdx / currentSubject.length) * 100}%`;
        
        const optContainer = document.getElementById('options');
        optContainer.innerHTML = '';
        
        q.a.forEach((text, i) => {
            const btn = document.createElement('button');
            btn.className = 'btn option-btn';
            btn.innerText = text;
            btn.onclick = () => checkAnswer(i, btn);
            optContainer.appendChild(btn);
        });
        document.getElementById('next-btn').classList.add('hidden');
    }

    function checkAnswer(idx, btn) {
        const cor = currentSubject[currentIdx].cor;
        const options = document.querySelectorAll('.option-btn');
        options.forEach(b => b.disabled = true);

        if(idx === cor) {
            btn.classList.add('correct');
            score++;
        } else {
            btn.classList.add('wrong');
            options[cor].classList.add('correct');
        }
        document.getElementById('next-btn').classList.remove('hidden');
    }

    function loadNextQuestion() {
        currentIdx++;
        if(currentIdx < currentSubject.length) {
            loadQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        document.getElementById('result-text').innerText = `${currentSubject.length}문제 중 ${score}문제를 맞혔습니다! 고생했어요!`;
    }
</script>
</body>
</html>
