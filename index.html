<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>국어 음운 체계 암기 마스터</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 90%; max-width: 500px; text-align: center; }
        h1 { color: #1a73e8; font-size: 1.5rem; margin-bottom: 1.5rem; }
        .question { font-size: 1.2rem; margin-bottom: 1.5rem; font-weight: bold; min-height: 60px; }
        .options { display: grid; gap: 10px; }
        button { padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; background: white; cursor: pointer; transition: 0.3s; font-size: 1rem; }
        button:hover { background: #f8f9fa; border-color: #1a73e8; }
        button.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        button.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
        #score { margin-top: 1.5rem; font-weight: bold; color: #5f6368; }
        #next-btn { margin-top: 1rem; background: #1a73e8; color: white; border: none; display: none; width: 100%; }
        .progress-bar { height: 5px; background: #e0e0e0; margin-bottom: 20px; border-radius: 5px; overflow: hidden; }
        .progress { height: 100%; background: #1a73e8; width: 0%; transition: 0.3s; }
    </style>
</head>
<body>

<div class="container">
    <div class="progress-bar"><div class="progress" id="progress"></div></div>
    <h1>🎤 국어 음운 체계 퀴즈</h1>
    <div id="quiz-box">
        <div class="question" id="question">문제를 불러오는 중...</div>
        <div class="options" id="options"></div>
        <button id="next-btn" onclick="nextQuestion()">다음 문제로</button>
    </div>
    <div id="score"></div>
</div>

<script>
    const quizData = [
        { q: "'ㅅ, ㅆ'은 소리 내는 방법 중 어디에 해당할까요?", a: ["마찰음", "파열음", "파찰음", "비음"], cor: 0 },
        { q: "입술소리(순음)이면서 울림소리(비음)인 자음은?", a: ["ㅂ", "ㅁ", "ㅍ", "ㅃ"], cor: 1 },
        { q: "단모음 분류 기준이 아닌 것은?", a: ["혀의 높낮이", "입술 모양", "혀의 앞뒤 위치", "소리의 세기"], cor: 3 },
        { q: "혀의 높이가 가장 낮은 '저모음'은?", a: ["ㅣ", "ㅡ", "ㅏ", "ㅜ"], cor: 2 },
        { q: "전설 모음이면서 원순 모음인 것은?", a: ["ㅣ", "ㅟ", "ㅔ", "ㅓ"], cor: 1 },
        { q: "자음 'ㅈ, ㅉ, ㅊ'은 어느 위치에서 날까요?", a: ["입술", "잇몸", "센입천장", "여린입천장"], cor: 2 },
        { q: "공기를 막았다가 한 번에 터뜨리는 소리는?", a: ["파열음", "마찰음", "비음", "유음"], cor: 0 }
    ];

    let currentIdx = 0;
    let score = 0;

    function loadQuestion() {
        const qEl = document.getElementById("question");
        const optEl = document.getElementById("options");
        const nextBtn = document.getElementById("next-btn");
        const progress = document.getElementById("progress");

        nextBtn.style.display = "none";
        optEl.innerHTML = "";
        
        let currentQ = quizData[currentIdx];
        qEl.innerText = currentQ.q;
        progress.style.width = `${(currentIdx / quizData.length) * 100}%`;

        currentQ.a.forEach((text, i) => {
            const btn = document.createElement("button");
            btn.innerText = text;
            btn.onclick = () => checkAnswer(i, btn);
            optEl.appendChild(btn);
        });
    }

    function checkAnswer(idx, btn) {
        const buttons = document.querySelectorAll("#options button");
        const correctIdx = quizData[currentIdx].cor;

        buttons.forEach(b => b.disabled = true);

        if(idx === correctIdx) {
            btn.classList.add("correct");
            score++;
        } else {
            btn.classList.add("wrong");
            buttons[correctIdx].classList.add("correct");
        }
        document.getElementById("next-btn").style.display = "block";
    }

    function nextQuestion() {
        currentIdx++;
        if(currentIdx < quizData.length) {
            loadQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById("quiz-box").innerHTML = `
            <h2>테스트 종료!</h2>
            <p style="font-size: 1.5rem;">총 ${quizData.length}문제 중 <b>${score}</b>문제 적중!</p>
            <button onclick="location.reload()" style="background:#5f6368; color:white; width:100%; border:none;">다시 도전하기</button>
        `;
        document.getElementById("progress").style.width = "100%";
    }

    loadQuestion();
</script>

</body>
</html>
