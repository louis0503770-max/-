<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web-LORANT: Neon & Bucky Range</title>
    <style>
        :root { --val-red: #ff4655; --val-blue: #00f3ff; --val-bg: #0f1923; --val-white: #ece8e1; }
        body { margin: 0; background: var(--val-bg); color: var(--val-white); font-family: 'Inter', sans-serif; overflow: hidden; cursor: crosshair; }
        
        /* 발로란트 로고 스타일 배경 */
        body::before { content: "VALORANT"; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 15vw; font-weight: 900; color: rgba(255, 70, 85, 0.03); z-index: -1; }

        /* 대시보드 UI */
        .header { position: absolute; top: 0; left: 0; width: 100%; padding: 20px 50px; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; border-bottom: 1px solid rgba(236, 232, 225, 0.1); background: rgba(15, 25, 35, 0.8); z-index: 100; }
        .logo { font-weight: 900; letter-spacing: 5px; color: var(--val-red); font-size: 1.5rem; }
        .logo span { color: var(--val-blue); }
        
        .stat-group { display: flex; gap: 40px; }
        .stat-item { text-align: right; }
        .stat-label { font-size: 0.7rem; color: #7e7e7e; text-transform: uppercase; }
        .stat-value { font-size: 2rem; font-weight: 800; }

        /* 게임 화면 */
        #game-canvas { display: block; width: 100vw; height: 100vh; }

        /* 오버레이 UI */
        #ui-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 100; }
        .btn-start { background: var(--val-red); color: var(--val-bg); border: none; padding: 20px 60px; font-size: 1.2rem; font-weight: 900; clip-path: polygon(10% 0, 100% 0, 90% 100%, 0% 100%); cursor: pointer; transition: 0.3s; }
        .btn-start:hover { transform: scale(1.1); filter: brightness(1.2); }

        /* 조준선 커스터마이징 */
        #crosshair { position: fixed; width: 20px; height: 20px; pointer-events: none; z-index: 200; transform: translate(-50%, -50%); }
        .ch-line { position: absolute; background: #00ff00; }
        .v { width: 2px; height: 8px; left: 9px; }
        .h { width: 8px; height: 2px; top: 9px; }
    </style>
</head>
<body>

    <div id="crosshair">
        <div class="ch-line v" style="top:0;"></div>
        <div class="ch-line v" style="bottom:0;"></div>
        <div class="ch-line h" style="left:0;"></div>
        <div class="ch-line h" style="right:0;"></div>
    </div>

    <div class="header">
        <div class="logo">WEB-LORANT <span>[NEON]</span></div>
        <div class="stat-group">
            <div class="stat-item">
                <div class="stat-label">Time</div>
                <div id="timer" class="stat-value">30</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Score</div>
                <div id="score" class="stat-value">0</div>
            </div>
        </div>
    </div>

    <div id="ui-overlay">
        <h1 style="font-size: 3rem; margin-bottom: 5px;">NEON's Range</h1>
        <p style="color: var(--val-blue); font-size: 1.2rem; margin-bottom: 30px;">Weapon: BUCKY (Press E to Dash)</p>
        <button class="btn-start" onclick="startGame()">GO, GO, GO!</button>
    </div>

    <canvas id="game-canvas"></canvas>

<script>
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    const ch = document.getElementById('crosshair');
    const scoreEl = document.getElementById('score');
    const timerEl = document.getElementById('timer');
    const overlay = document.getElementById('ui-overlay');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // 게임 상태
    let score = 0;
    let timeLeft = 30;
    let gameActive = false;
    let target = { x: 0, y: 0, r: 35 };
    let particles = [];
    let mx = 0, my = 0; // 마우스 위치

    // 네온 이미지 (투명 배경)
    const neonImg = new Image();
    neonImg.src = 'https://media.valorant-api.com/agents/bb2a4430-43ac-448c-9523-32f259eb85ac/fullportrait.png';

    // 플레이어 (네온) 객체
    const player = { x: canvas.width/2, y: canvas.height/2, w: 200, h: 250, targetX: canvas.width/2, targetY: canvas.height/2, speed: 0.1 };

    // 조준점 마우스 따라다니기 및 위치 저장
    window.addEventListener('mousemove', (e) => {
        ch.style.left = e.clientX + 'px';
        ch.style.top = e.clientY + 'px';
        mx = e.clientX;
        my = e.clientY;
        player.targetX = mx;
        player.targetY = my;
    });

    // 대시 스킬 (E 키)
    window.addEventListener('keydown', (e) => {
        if (!gameActive) return;
        if (e.code === 'KeyE') {
            player.x = mx;
            player.y = my;
            player.speed = 0.5; // 대시 중 가속
            // 전기 이펙트 추가 가능 (추후 구현)
        }
    });

    window.addEventListener('keyup', (e) => { if (e.code === 'KeyE') player.speed = 0.1; });

    function spawnTarget() {
        target.r = Math.random() * (45 - 25) + 25;
        target.x = Math.random() * (canvas.width - target.r * 2) + target.r;
        target.y = Math.random() * (canvas.height - target.r * 2 - 100) + target.r + 100;
    }

    function createExplosion(x, y) {
        for (let i = 0; i < 15; i++) {
            particles.push({
                x, y,
                vx: (Math.random() - 0.5) * 8,
                vy: (Math.random() - 0.5) * 8,
                r: Math.random() * 5 + 2,
                color: Math.random() < 0.3 ? '#00f3ff' : '#ff4655', // 네온 블루 + 발로란트 레드
                life: 30
            });
        }
    }

    function startGame() {
        score = 0;
        timeLeft = 30;
        gameActive = true;
        scoreEl.innerText = score;
        overlay.style.display = 'none';
        spawnTarget();
        
        const gameTimer = setInterval(() => {
            timeLeft--;
            timerEl.innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(gameTimer);
                endGame();
            }
        }, 1000);
    }

    function endGame() {
        gameActive = false;
        overlay.style.display = 'block';
        overlay.innerHTML = `
            <h1 style="font-size: 3rem; margin-bottom: 10px;">TRAINING COMPLETE</h1>
            <p style="font-size: 1.5rem; color: #ff4655; margin-bottom: 30px;">FINAL SCORE: ${score}</p>
            <button class="btn-start" onclick="location.reload()">RESTART</button>
        `;
    }

    canvas.addEventListener('mousedown', (e) => {
        if (!gameActive) return;

        // 버키 산탄 구현 (7발)
        for (let i = 0; i < 7; i++) {
            // 산탄 퍼짐 (펠렛)
            const pelX = e.clientX + (Math.random() - 0.5) * 50;
            const pelY = e.clientY + (Math.random() - 0.5) * 50;

            // 타격 판정
            const dist = Math.hypot(pelX - target.x, pelY - target.y);
            if (dist < target.r) {
                score++;
                scoreEl.innerText = score;
                createExplosion(target.x, target.y); // 타겟 위치에 파편
                spawnTarget();
                break; // 한 타겟은 한 번만 맞춤
            }
            
            // 총알 자국 (추후 구현)
            createExplosion(pelX, pelY); // 총알 자국 위치에 파편
        }
    });

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (gameActive) {
            // 네온 캐릭터 그리기 (마우스 방향으로 부드럽게 이동)
            player.x += (player.targetX - player.x) * player.speed;
            player.y += (player.targetY - player.y) * player.speed;
            
            // 캐릭터 전기 이펙트 (네온 블루)
            ctx.shadowBlur = player.speed * 100;
            ctx.shadowColor = '#00f3ff';
            ctx.drawImage(neonImg, player.x - player.w/2, player.y - player.h/2, player.w, player.h);
            ctx.shadowBlur = 0;

            // 타겟 그리기 (발로란트 훈련장 봇 느낌)
            ctx.beginPath();
            ctx.arc(target.x, target.y, target.r, 0, Math.PI * 2);
            ctx.fillStyle = '#ece8e1';
            ctx.fill();
            
            // 타겟 내부 붉은 원
            ctx.beginPath();
            ctx.arc(target.x, target.y, target.r * 0.5, 0, Math.PI * 2);
            ctx.fillStyle = '#ff4655';
            ctx.fill();

            // 파편 이펙트 그리기
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
                p.x += p.vx; p.y += p.vy;
                p.vx *= 0.95; p.vy *= 0.95; // 감속
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        requestAnimationFrame(draw);
    }

    window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });

    draw();
</script>
</body>
</html>
