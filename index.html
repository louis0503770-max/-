<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>중2 기말고사 올킬 v4.0</title>
    <style>
        :root { --primary: #6366f1; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #818cf8; --success: #22c55e; --danger: #ef4444; }
        body { font-family: 'Pretendard', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 700px; background: var(--card); padding: 1.5rem; border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        .header { text-align: center; margin-bottom: 2rem; }
        .grid-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn { padding: 16px; border: none; border-radius: 14px; background: var(--primary); color: white; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 1rem; }
        .btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .hidden { display: none !important; }
        
        /* 학습 카드 스타일 */
        .study-box { background: #0f172a; padding: 15px; border-radius: 12px; margin: 15px 0; border-left: 4px solid var(--accent); }
        .study-box h3 { margin-top: 0; color: var(--accent); }
        table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 0.85rem; }
        th, td { border: 1px solid #334155; padding: 8px; text-align: center; }
        th { background: var(--primary); }

        /* 퀴즈 스타일 */
        #timer { text-align: right; color: #fbbf24; font-weight: bold; margin-bottom: 10px; }
        .option-btn { background: #334155; margin-bottom: 8px; text-align: left; width: 100%; }
        .correct { background: var(--success) !important; }
        .wrong { background: var(--danger) !important; }
    </style>
</head>
<body>

<div class="container">
    <div id="main-menu">
        <div class="header"><h1>🎓 전과목 마스터 v4.0</h1><p>오늘의 학습 과목을 선택하세요</p></div>
        <div class="grid-menu">
            <button class="btn" onclick="showSubMenu('korean')">국어</button>
            <button class="btn" onclick="showSubMenu('math')" style="background:#ec4899;">수학</button>
            <button class="btn" onclick="showSubMenu('english')" style="background:#10b981;">영어</button>
            <button class="btn" onclick="showSubMenu('science')" style="background:#f59e0b;">과학</button>
        </div>
    </div>

    <div id="sub-menu" class="hidden">
        <div class="header"><h1 id="sub-title">과목명</h1><p>단원을 선택하세요</p></div>
        <div id="unit-buttons" class="grid-menu" style="grid-template-columns: 1fr;"></div>
        <button class="btn" style="margin-top:15px; background:#475569; width:100%;" onclick="goHome()">메인으로</button>
    </div>

    <div id="study-screen" class="hidden">
        <div class="header"><h2 id="study-title">단원 요약</h2></div>
        <div id="study-content"></div>
        <button class="btn" style="width:100%; margin-top:20px;" onclick="startQuiz()">개념 완료! 시험 시작</button>
    </div>

    <div id="quiz-screen" class="hidden">
        <div id="timer">0초</div>
        <h2 id="question"></h2>
        <div id="options"></div>
        <button id="next-btn" class="btn hidden" style="width:100%; margin-top:1rem;" onclick="loadNext()">다음 문제</button>
    </div>

    <div id="result-screen" class="hidden">
        <div class="header"><h1>수고하셨습니다!</h1><p id="final-res"></p><button class="btn" style="width:100%" onclick="goHome()">목록으로</button></div>
    </div>
</div>

<script>
    const data = {
        korean: {
            title: "국어",
            units: [
                { name: "음운 체계", study: "자음(파열, 마찰, 파찰 등)과 단모음 10개 체계를 복습하세요.", questions: [{q:"입술소리 비음은?", a:["ㅁ","ㄴ","ㅇ"], cor:0}] },
                { name: "화자와 서술자", study: "1인칭(나), 3인칭(관찰자/전지적) 시점의 차이를 확인하세요.", questions: [{q:"작품 밖에서 속마음까지 아는 시점?", a:["전지적 작가","1인칭 주인공"], cor:0}] },
                { name: "한글 창제 원리", study: "상형의 원리(발음기관/천지인)와 가획의 원리를 기억하세요.", questions: [{q:"ㄱ에 획을 더한 글자는?", a:["ㅋ","ㄴ","ㄷ"], cor:0}] }
            ]
        },
        math: {
            title: "수학",
            units: [
                { name: "유리수와 순환소수", study: "유한소수는 분모의 소인수가 2나 5뿐이어야 합니다.", questions: [{q:"다음 중 유한소수인 것은?", a:["1/3", "3/20", "5/6"], cor:1}] },
                { name: "삼각형의 외심과 내심", study: "외심: 세 변의 수직이등분선의 교점 / 내심: 세 각의 이등분선의 교점", questions: [{q:"내심에서 세 변에 이르는 거리는?", a:["같다", "다르다"], cor:0}] }
            ]
        },
        english: {
            title: "영어",
            units: [
                { name: "현재완료 (have+p.p.)", study: "완료, 경험, 계속, 결과 4가지 용법을 구분하세요.", questions: [{q:"I have ( ) to Paris. (가본 적 있다)", a:["been", "gone"], cor:0}] },
                { name: "비교급과 최상급", study: "more/most, -er/-est 규칙과 원급 비교(as~as)를 체크하세요.", questions: [{q:"better의 원급은?", a:["good", "bad", "well"], cor:0}] },
                { name: "수여동사 (4→3형식)", study: "to(give, send), for(make, buy), of(ask) 전치사를 주의하세요.", questions: [{q:"I made him a cake. -> I made a cake ( ) him.", a:["to", "for", "of"], cor:1}] },
                { name: "주격 관계대명사", study: "Who, Which, That 뒤에 바로 동사가 오며 선행사를 수식합니다.", questions: [{q:"I know a boy ( ) likes soccer.", a:["who", "which"], cor:0}] }
            ]
        },
        science: {
            title: "과학",
            units: [
                { name: "빛과 파동", study: "반사의 법칙, 굴절, 거울과 렌즈의 특징, 파동의 요소를 공부하세요.", questions: [{q:"빛이 꺾이는 현상은?", a:["반사", "굴절", "회절"], cor:1}] },
                { name: "물질의 특성 & 혼합물 분리", study: "밀도, 용해도, 끓는점 차이를 이용한 분리 방법을 익히세요.", questions: [{q:"물과 기름을 분리할 때 이용하는 특성은?", a:["밀도", "끓는점", "용해도"], cor:0}] }
            ]
        }
    };

    let curSubject, curUnit, curQIdx, score, sec, timer;

    function showSubMenu(sub) {
        curSubject = sub;
        document.getElementById('main-menu').classList.add('hidden');
        document.getElementById('sub-menu').classList.remove('hidden');
        document.getElementById('sub-title').innerText = data[sub].title;
        const container = document.getElementById('unit-buttons');
        container.innerHTML = '';
        data[sub].units.forEach((u, i) => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = u.name;
            btn.onclick = () => showStudy(i);
            container.appendChild(btn);
        });
    }

    function showStudy(idx) {
        curUnit = idx;
        document.getElementById('sub-menu').classList.add('hidden');
        document.getElementById('study-screen').classList.remove('hidden');
        document.getElementById('study-title').innerText = data[curSubject].units[idx].name;
        document.getElementById('study-content').innerHTML = `<div class='study-box'>${data[curSubject].units[idx].study}</div>`;
    }

    function startQuiz() {
        document.getElementById('study-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        curQIdx = 0; score = 0; sec = 0;
        timer = setInterval(() => { sec++; document.getElementById('timer').innerText = sec + '초'; }, 1000);
        loadQ();
    }

    function loadQ() {
        const q = data[curSubject].units[curUnit].questions[curQIdx];
        document.getElementById('question').innerText = `Q. ${q.q}`;
        const opts = document.getElementById('options');
        opts.innerHTML = '';
        q.a.forEach((t, i) => {
            const b = document.createElement('button');
            b.className = 'btn option-btn';
            b.innerText = t;
            b.onclick = () => {
                if(i === q.cor) { b.classList.add('correct'); score++; }
                else { b.classList.add('wrong'); }
                document.querySelectorAll('.option-btn').forEach(btn => btn.disabled = true);
                document.getElementById('next-btn').classList.remove('hidden');
            };
            opts.appendChild(b);
        });
    }

    function loadNext() {
        curQIdx++;
        if(curQIdx < data[curSubject].units[curUnit].questions.length) {
            document.getElementById('next-btn').classList.add('hidden');
            loadQ();
        } else {
            clearInterval(timer);
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('final-res').innerText = `${score} / ${data[curSubject].units[curUnit].questions.length} 정답! (${sec}초 소요)`;
        }
    }

    function goHome() { location.reload(); }
</script>
</body>
</html>
